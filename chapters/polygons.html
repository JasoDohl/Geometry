<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNRSYfjGERQOwJxtVkHWnk7z2o0SAvzFs",
        authDomain: "dohl-s-geometry.firebaseapp.com",
        projectId: "dohl-s-geometry",
        storageBucket: "dohl-s-geometry.firebasestorage.app",
        messagingSenderId: "92329448606",
        appId: "1:92329448606:web:dc62534a6c4c972b7f178f",
        measurementId: "G-2FHN2VX726"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUserId = null;

    // --- 1. LOGIN & AUTH LOGIC ---
    const loginBtn = document.getElementById('login-btn');
    const userDisplay = document.getElementById('user-display');

    loginBtn.addEventListener('click', () => {
        if (!currentUserId) {
            signInWithPopup(auth, provider).catch(err => console.error(err));
        } else {
            signOut(auth);
        }
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            userDisplay.innerHTML = `Welcome, <b>${user.displayName}</b>!`;
            loginBtn.innerText = "Sign Out";
            await setDoc(doc(db, "students", user.uid), {
                name: user.displayName,
                email: user.email,
                lastLogin: new Date()
            }, { merge: true });
        } else {
            currentUserId = null;
            userDisplay.innerHTML = "Not signed in. Progress will NOT be saved.";
            loginBtn.innerText = "Sign in with Google";
        }
    });

    // --- 2. LOAD QUESTIONS (The "Clean Text" version) ---
    async function fetchQuestions() {
        const container = document.getElementById('question-container');
        const q = query(collection(db, "questions"), where("chapter", "==", "Polygons"));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
            container.innerHTML = '<p>No questions yet.</p>';
            return;
        }

        container.innerHTML = '';
        querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();

            // CLEANING THE TEXT: This removes $ and ^\circ automatically
            let displayWeightText = data.text
                .replace(/\$|\^\\circ\$/g, '') // Removes $ and code like ^\circ$
                .replace(/\\circ/g, '°');     // Replaces \circ with a real ° symbol

            // SMART IMAGE: Only shows if the URL is valid
            const imageTag = (data.imageUrl && data.imageUrl.length > 5) 
                ? `<img src="${data.imageUrl}" style="max-width:100%; border-radius:8px; margin: 15px 0; display:block;">` 
                : "";

            container.innerHTML += `
                <div style="border:1px solid #ddd; padding:20px; margin-bottom:20px; border-radius:10px; background:#fff;">
                    <h3>${data.title}</h3>
                    <p style="font-size:1.1em;">${displayWeightText}</p>
                    ${imageTag}
                    <div style="margin-top:10px;">
                        <input type="number" id="ans-${docSnap.id}" placeholder="?" style="padding:8px; width:80px;">
                        <button class="check-btn" style="padding:8px 15px;" onclick="checkQuestion('${docSnap.id}', ${data.correctAnswer})">Check</button>
                        <span id="feedback-${docSnap.id}" style="margin-left:10px; font-weight:bold;"></span>
                    </div>
                </div>`;
        });
    }
    fetchQuestions();

    // --- 3. QUESTION CHECKER ---
    window.checkQuestion = (id, correct) => {
        const val = parseFloat(document.getElementById('ans-'+id).value);
        const feedback = document.getElementById('feedback-'+id);
        if(val === correct) {
            feedback.innerText = "✅ Correct!";
            feedback.style.color = "green";
        } else {
            feedback.innerText = "❌ Try again.";
            feedback.style.color = "red";
        }
    }

    // --- 4. POLYGON TOOL LOGIC ---
    const canvas = document.getElementById('polyCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('sidesRange');
    let correctTriangles = 0;
    let correctDegrees = 0;

    function drawPolygon() {
        const sides = parseInt(slider.value);
        correctTriangles = sides - 2;
        correctDegrees = correctTriangles * 180;
        document.getElementById('sidesVal').innerText = sides;
        document.getElementById('user-triangles').value = '';
        document.getElementById('user-degrees').value = '';
        document.getElementById('tool-feedback').innerText = '';

        const radius = 100;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let vertices = [];
        for (let i = 0; i < sides; i++) {
            const angle = (i * 2 * Math.PI / sides) - (Math.PI / 2);
            vertices.push({ x: centerX + radius * Math.cos(angle), y: centerY + radius * Math.sin(angle) });
        }

        // Draw Triangles
        for (let i = 1; i < sides - 1; i++) {
            ctx.beginPath();
            ctx.moveTo(vertices[0].x, vertices[0].y);
            ctx.lineTo(vertices[i].x, vertices[i].y);
            ctx.lineTo(vertices[i+1].x, vertices[i+1].y);
            ctx.fillStyle = `hsl(${i * 40}, 70%, 80%)`;
            ctx.fill();
            ctx.stroke();
        }
    }

    window.checkToolAnswer = async () => {
        const uTri = parseInt(document.getElementById('user-triangles').value);
        const uDeg = parseInt(document.getElementById('user-degrees').value);
        const feed = document.getElementById('tool-feedback');

        if (uTri === correctTriangles && uDeg === correctDegrees) {
            feed.innerText = "✅ Perfect! Chapter progress saved.";
            feed.style.color = "green";
            if (currentUserId) {
                await setDoc(doc(db, "students", currentUserId), { finished_polygons: true }, { merge: true });
            }
        } else {
            feed.innerText = "❌ Check your count or math.";
            feed.style.color = "red";
        }
    };

    slider.addEventListener('input', drawPolygon);
    drawPolygon();
</script>
